name: Apply reviewed atomic start-state fix

on:
  push:
    branches:
      - feature/web-bridge-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/web-bridge-vertical-slice
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Apply reviewed atomic-state patch
        run: python3 .github/scripts/fix_start_state.py
      - name: Validate and commit
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/session/mod.rs
          git commit -m "fix: make dictation start state atomic"
          git push origin HEAD:feature/web-bridge-vertical-slice
