name: Apply terminology UI

on:
  push:
    branches:
      - feature/ptap-terminology-seed

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/ptap-terminology-seed

      - name: Apply terminology UI integration
        run: python .github/apply-terminology-ui.py

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            build-essential \
            curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build
      - name: Rust tests
        working-directory: ./src-tauri
        run: cargo test --lib
      - name: Rust check
        working-directory: ./src-tauri
        run: cargo check

      - name: Remove one-time integration files
        run: |
          rm -f .github/apply-terminology-ui.py
          rm -f .github/workflows/apply-terminology-ui.yml

      - name: Commit verified UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add PTAP terminology management UI"
          git push origin HEAD:feature/ptap-terminology-seed
