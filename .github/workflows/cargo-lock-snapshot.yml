name: Cargo lock snapshot

on:
  push:
    branches:
      - feature/web-bridge-vertical-slice

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/web-bridge-vertical-slice
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Generate and commit lockfile when changed
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for web bridge"
          git push origin HEAD:feature/web-bridge-vertical-slice
