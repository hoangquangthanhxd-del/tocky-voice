name: Apply reviewed session start race fix

on:
  push:
    branches:
      - feature/web-bridge-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
