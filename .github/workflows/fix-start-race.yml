''', '''#[derive(Default)]
pub struct Recorder {
    /// Atomic reservation for the synchronous setup window before `active` can hold the
    /// fully constructed take. Without this, two entry points can both observe an empty
    /// `active` slot, open separate microphones/providers, and the later write wins.
    starting: AtomicBool,
    active: Mutex<Option<ActiveTake>>,
    /// Present while a stopped take is still waiting on the provider. Sending on it
    /// abandons that wait — the escape hatch from a socket that never answers.
    finalizing: Mutex<Option<oneshot::Sender<()>>>,
}

struct StartReservation<'a> {
    flag: &'a AtomicBool,
}

impl Drop for StartReservation<'_> {
    fn drop(&mut self) {
        self.flag.store(false, Ordering::Release);
    }
}

impl Recorder {
    pub fn is_recording(&self) -> bool {
        self.active
            .lock()
            .map(|slot| slot.is_some())
            .unwrap_or(false)
    }

    /// True during both synchronous setup and an established recording. Callers that
    /// want to start another microphone/session must use this rather than only checking
    /// the fully constructed `active` slot.
    pub fn is_busy(&self) -> bool {
        self.starting.load(Ordering::Acquire) || self.is_recording()
    }

    fn try_reserve_start(&self) -> Option<StartReservation<'_>> {
        self.starting
            .compare_exchange(false, true, Ordering::AcqRel, Ordering::Acquire)
            .ok()?;
        Some(StartReservation {
            flag: &self.starting,
        })
    }
}
''', "recorder reservation")

